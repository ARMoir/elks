name: Preserve verified IBM PS/2 XEyes dynamic-menu release

# Archive the exact 1.44 MB hardware-tested artifact; never rebuild or overwrite prior releases.
on:
  push:
    branches: [master]
    paths:
      - '.github/manual-build-requests/preserve-ps2-nxeyes-dynamic-menu.txt'

permissions:
  contents: write
  actions: read

jobs:
  release_verified_eyes_image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download exact hardware-tested image and verify SHA-256 (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 39997340890 -R ARMoir/elks \
            -n elks-ibm-ps2-nxeyes-dynamic-menu-fd1440-fat -D release
          test "$(stat -c '%s' release/fd1440.img)" -eq 1474560
          echo "9d86733b541bb751f3355d7985e18ab4dd2e700964ad20caf36ada12f924600e  release/fd1440.img" | sha256sum -c -
          mv release/fd1440.img release/ELKS_0.9.2_IBM_PS2_NanoX_XEyes_DynamicMenu_KSTACK830_WORKING.img

      - name: Publish new verified IBM PS/2 Nano-X + XEyes release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # ELKS 0.9.2 — Real IBM PS/2 with XEyes and a dynamic Nano-X menu

          Verified by the user on real vintage IBM PS/2 hardware (2 MB RAM).
          This is the **identical 1.44 MB FAT12 floppy image** from GitHub
          Actions run 39997340890, not another compile.

          Includes:
          - Working ELKS 0.9.2 with 830-byte async-I/O kernel stacks and
            BIOS-accessed floppy root on /dev/fd0.
          - Nano-X graphical desktop with native PS/2 mouse.
          - New lightweight XEyes-style Nano-X program (`nxeyes`), with pupils
            tracking the mouse and accounting for window-frame repositioning.
          - Start menu filtered **at launch** to include only programs present
            on the floppy; Quit is always retained.
          - Automatic `elkfetch` at root login, a compact display without
            the long kernel-build row.
          - Boot-time `rm -f /tmp/nxsock` in /etc/rc.sys.
          - Approximately 255 KB free space on the 1.44 MB floppy.

          **Rollback:** Both previous verified releases remain unchanged:
          `ibm-ps2-kstack830-working-20261023` and `ibm-ps2-working-20261022`.

          **Image provenance:**
          - Frozen source commit: `b9aac165d2dab416044bcac5f1d391532444b8a2`
          - Frozen source branch: `ibm-ps2-nanox-eyes-dynamic-menu-working-20261023`
          - Original GitHub Actions run: 39997340890
          - Original artifact: `elks-ibm-ps2-nxeyes-dynamic-menu-fd1440-fat`
          - Image SHA-256: `9d86733b541bb751f3355d7985e18ab4dd2e700964ad20caf36ada12f924600e`
          - Size: 1,474,560 bytes

          Note: The browser flagged the original GitHub Actions ZIP with a
          malware warning. A successful build and matching checksum verify
          provenance, not malware safety; run an independent security scan
          before use. The image was confirmed operational on the user's hardware.
          EOF
          gh release create ibm-ps2-nxeyes-dynamic-menu-working-20261023 \
            release/ELKS_0.9.2_IBM_PS2_NanoX_XEyes_DynamicMenu_KSTACK830_WORKING.img \
            --repo ARMoir/elks \
            --target b9aac165d2dab416044bcac5f1d391532444b8a2 \
            --title "ELKS IBM PS/2: verified Nano-X desktop, XEyes & dynamic menu" \
            --notes-file release-notes.md
