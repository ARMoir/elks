name: Preserve verified IBM PS/2 830-stack release

# One-time exact-image preservation; does not rebuild or replace baseline v1.
on:
  push:
    branches: [master]
    paths:
      - '.github/manual-build-requests/preserve-working-ps2-kstack830.txt'

permissions:
  contents: write
  actions: read

jobs:
  release_verified_image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download exact real-hardware-tested 830-stack image (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download 39892197319 -R ARMoir/elks \
            -n elks-ibm-ps2-kstack-830-fd1440-fat -D release
          test "$(stat -c '%s' release/fd1440.img)" -eq 1474560
          echo "d26a700852fdbe00255eb9c0b9905bb85503064fd9b29f954e3ab94c169f1295  release/fd1440.img" | sha256sum -c -
          mv release/fd1440.img release/ELKS_0.9.2_IBM_PS2_NanoX_Mouse_KSTACK830_WORKING.img

      - name: Create immutable-tagged verified PS/2 hardware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # IBM PS/2 working desktop - 830-byte kernel stack

          Real IBM PS/2 hardware tested 2026-10-22/23 with 2 MB RAM and a
          1.44 MB FAT12 BIOS floppy. Boots ELKS 0.9.2, starts the Nano-X desktop,
          has a working native PS/2 mouse, and automatically displays elkfetch
          at root login.

          Compared with the first working Nano-X/mouse release:
          - Increased async-I/O per-task kernel stack from 700 to 830 bytes.
          - No KSTACK overflow seen on the reported successful boot.
            This does not establish absence under every workload.
          - Preserved BIOS-based /dev/fd0 floppy I/O; direct-FDC experiment
            failed on the physical controller and is NOT included.
          - Restored automatic `rm -f /tmp/nxsock` in /etc/rc.sys before login.
          - Removed the overly long "Kernel build" field from elkfetch.

          This is the exact GitHub Actions image verified on the user's
          physical IBM PS/2, not a rebuild.

          **Previous working baseline:** release `ibm-ps2-working-20261022`
          is preserved unchanged as a rollback option.

          Frozen source commit: df5461d639b6a482a4df38d9febf10ad467dfe9f
          Frozen source branch: ibm-ps2-nanox-kstack830-working-20261023
          Source Actions run: 39892197319

          Image SHA-256: d26a700852fdbe00255eb9c0b9905bb85503064fd9b29f954e3ab94c169f1295
          Image size: 1,474,560 bytes
          EOF
          gh release create ibm-ps2-kstack830-working-20261023 \
            release/ELKS_0.9.2_IBM_PS2_NanoX_Mouse_KSTACK830_WORKING.img \
            --repo ARMoir/elks \
            --target df5461d639b6a482a4df38d9febf10ad467dfe9f \
            --title "ELKS IBM PS/2: verified Nano-X + mouse, 830-byte stack" \
            --notes-file release-notes.md
