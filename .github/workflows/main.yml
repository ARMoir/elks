name: IBM PS/2 floppy (manual)

# This workflow must exist on the default branch for Run workflow to appear.
# The actual ELKS sources are checked out from ibm-ps2-hardware.
on:
  workflow_dispatch:
  # A build-request file is the only push event permitted to start this job.
  # Routine source commits never trigger an image build.
  push:
    branches:
      - master
    paths:
      - '.github/manual-build-requests/ibm-ps2.txt'

permissions:
  contents: read

jobs:
  ibm_floppy:
    name: Build one IBM PS/2 1.44 MB FAT floppy
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out IBM diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ibm-ps2-hardware

      - name: Install ELKS build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing texinfo libncurses5-dev libelf-dev ncompress nasm

      - name: Cache 16-bit cross-compiler
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: cross
          key: cross-${{ hashFiles('tools/*') }}-${{ runner.os }}

      - name: Build 16-bit cross-compiler if needed
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: tools/build.sh

      - name: Build IBM PS/2 FAT floppy only
        shell: bash
        run: |
          set -euo pipefail
          . ./env.sh
          # Generate keyboard maps before building the kernel.
          make -C elks/arch/i86/drivers/char/KeyMaps config.in
          cp ibmpc-1440-ps2diag.config .config
          # Turn our fixed .config into include/autoconf.h without prompting.
          make include/autoconf.h
          grep -q '^#define CONFIG_IBM_PS2_DIAGNOSTIC 1' include/autoconf.h
          grep -q '^CONFIG_IMG_FD1440=y' .config
          grep -q '^CONFIG_IMG_FAT=y' .config

          # Do not invoke build.sh auto ext allimages: that makes many images.
          make -C libc all
          make -C libc DESTDIR="$CROSSDIR" install
          make kernel bootblocks
          make -C elkscmd all
          # Nano-X needs the ELKS libc installed before it can link.
          ./buildext.sh microwindows
          # Image generation occurs exactly once, for FD1440/FAT in .config.
          make -C image

          test -s target/bin/elkfetch
          grep -q '^/bin/elkfetch$' target/etc/rc.sys
          grep -q '^export MOUSE_TYPE=ps2$' target/etc/profile
          grep -q '^#hma=kernel$' target/bootopts
          grep -q '^rm -f /tmp/nxsock$' target/etc/rc.sys
          test -f image/fd1440.img
          test "$(stat -c '%s' image/fd1440.img)" -eq 1474560

      - name: Upload the one boot floppy image
        uses: actions/upload-artifact@v4
        with:
          name: elks-ibm-ps2-fd1440-fat
          path: image/fd1440.img
          if-no-files-found: error
